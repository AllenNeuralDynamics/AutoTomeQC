[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autotomeqc"
version = "0.10.1-dev.2"
description = "Sectioning quality control"

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ultralytics>=8.4.0",
    "torch>=2.4.0",
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "PyYAML>=6.0",
    "lapx>=0.5.5",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "python-multipart"
]

[project.scripts]
autotomeqc = "autotomeqc.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.9.9",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]
docs = [
    'mkdocs',
    'mkdocs-material',
    'mkdocstrings[python]'
]

[tool.hatch.build.targets.wheel]
packages = ["src/autotomeqc"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
