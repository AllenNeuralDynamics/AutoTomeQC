name: Sync Workspace Versions

on:
  workflow_dispatch:
  workflow_call:

jobs:
  sync-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }} 

      - name: Sync, Commit, and Push
        run: |
          ROOT_VERSION=$(grep -m 1 '^version = ' pyproject.toml | cut -d '"' -f 2)
          sed -i "s/^version = .*/version = \"$ROOT_VERSION\"/" qc/pyproject.toml
          sed -i "s/^version = .*/version = \"$ROOT_VERSION\"/" web/pyproject.toml

          if git diff --exit-code qc/pyproject.toml web/pyproject.toml; then
            echo "No changes needed."
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add qc/pyproject.toml web/pyproject.toml
          git commit -m "chore: sync workspace member versions to $ROOT_VERSION [skip ci]"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}