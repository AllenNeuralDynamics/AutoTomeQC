name: Tag and Publish
on:
  push:
    branches:
      - main
      - dev
      - 'feat*'

jobs:
  test-lint-and-type-check:
    uses: ./.github/workflows/test_lint_type.yml
    secrets: inherit

  tag-version:
    runs-on: ubuntu-latest
    needs: test-lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Get Version and Branch Info
        id: meta
        run: |
          # Extract version directly from __init__.py to avoid sync issues
          # This looks for __version__ = "X.X.X" in your project file
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('src/autotomeqc/__init__.py').read()).group(1))")
          
          # Determine if we are on a feature branch
          if [[ "${{ github.ref_name }}" == feat/* ]]; then
            # Clean branch name: feat/my-fix -> feat-my-fix
            BRANCH_CLEAN=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
            FULL_TAG="v${VERSION}-${BRANCH_CLEAN}"
          else
            FULL_TAG="v${VERSION}"
          fi
          
          echo "FULL_TAG=$FULL_TAG" >> $GITHUB_ENV
          echo "Detected Tag: $FULL_TAG"

      - name: Create and Push Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "${{ env.FULL_TAG }}" >/dev/null 2>&1; then
            echo "Creating tag: ${{ env.FULL_TAG }}"
            git tag "${{ env.FULL_TAG }}"
            git push origin "${{ env.FULL_TAG }}"
          else
            echo "Tag ${{ env.FULL_TAG }} already exists. Skipping."
          fi

      - name: Build Wheel (Verification)
        run: uv build