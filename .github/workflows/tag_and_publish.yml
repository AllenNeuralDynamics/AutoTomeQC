name: Tag and Publish
on:
  push:
    branches:
      - main
      - dev

jobs:
  test-lint-and-type-check:
    uses: ./.github/workflows/test_lint_type.yml
    secrets: inherit

  tag-version:
    runs-on: ubuntu-latest
    needs: test-lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Get Version and Branch Info
        id: meta
        run: |
          # Extract version from __init__.py
          VERSION=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*[\"\']([^\"\']+)[\"\']', open('src/autotomeqc/__init__.py').read()).group(1))")
          
          # Check if we are on a feature branch for SemVer pre-release
          if [[ "${{ github.ref_name }}" =~ ^feat ]]; then
            # SemVer Rule: Only [0-9A-Za-z-] allowed.
            # Replace slashes and underscores with hyphens.
            BRANCH_SEMVER=$(echo "${{ github.ref_name }}" | sed 's/[/_]/-/g')

            # SemVer Format: <version>-<pre-release>
            FULL_TAG="v${VERSION}-${BRANCH_SEMVER}"
          else
            # Standard Release Version
            FULL_TAG="v${VERSION}"
          fi
          
          echo "FULL_TAG=$FULL_TAG" >> $GITHUB_ENV
          echo "Detected Tag: $FULL_TAG"

      - name: Create and Push Tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if ! git rev-parse "${{ env.FULL_TAG }}" >/dev/null 2>&1; then
            echo "Creating tag: ${{ env.FULL_TAG }}"
            git tag "${{ env.FULL_TAG }}"
            git push origin "${{ env.FULL_TAG }}"
          else
            echo "Tag ${{ env.FULL_TAG }} already exists. Skipping."
          fi

      - name: Build Wheel (Verification)
        run: uv build