[project]
name = "autotome-ui"
version = "0.1.0"
description = "Frontend Web UI for AutoTomeQC"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=1.4.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pywebview",
    "imagesize",
    "autotomeqc[api]",
]

[tool.uv.sources]
autotome-ui = { workspace = true }

[project.scripts]
autotome-ui = "autotome_ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autotome_ui"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.9",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "selenium",
]

[[tool.mypy.overrides]]
module = "imagesize"
ignore_missing_imports = true
