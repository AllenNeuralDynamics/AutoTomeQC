[project]
name = "autotome-ui"
version = "0.1.0"
description = "Frontend Web UI for AutoTomeQC"
requires-python = ">=3.11"
dependencies = [
    "nicegui>=1.4.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pywebview",
    "imagesize",
]

[tool.uv.sources]
autotome-ui = { workspace = true }

[project.scripts]
autotome-ui = "web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/web"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.9",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
    "selenium",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p nicegui.testing.plugin"
main_file = "src/web/main.py"

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
[[tool.mypy.overrides]]
module = "imagesize"
ignore_missing_imports = true
